<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Công cụ Mã hóa Ảnh</title>
    <!-- Thư viện xử lý file ZIP -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <style>
      body {
        font-family:
          -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica,
          Arial, sans-serif;
        display: flex;
        flex-direction: column;
        align-items: center;
        background-color: #f4f4f9;
        padding: 20px;
        color: #333;
      }
      .container {
        background: white;
        padding: 2rem;
        border-radius: 12px;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        max-width: 600px;
        width: 100%;
      }
      h2 {
        text-align: center;
        margin-top: 0;
      }
      .info {
        font-size: 0.9rem;
        color: #666;
        margin-bottom: 20px;
        text-align: center;
      }
      .form-group {
        margin-bottom: 15px;
      }
      .radio-group {
        display: flex;
        gap: 20px;
        margin-bottom: 15px;
        justify-content: center;
        flex-wrap: wrap;
      }
      label {
        cursor: pointer;
      }
      input[type='text'],
      input[type='password'],
      select {
        padding: 10px;
        width: 100%;
        border-radius: 6px;
        border: 1px solid #ccc;
        box-sizing: border-box;
      }
      input[type='file'] {
        padding: 10px;
        width: 100%;
        border-radius: 6px;
        border: 1px dashed #ccc;
        box-sizing: border-box;
        background: #fafafa;
        cursor: pointer;
      }
      .checkbox-group {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-top: 15px;
        font-size: 0.9rem;
      }
      button {
        margin-top: 15px;
        padding: 12px;
        width: 100%;
        border-radius: 6px;
        border: none;
        cursor: pointer;
        font-weight: bold;
        transition: background 0.2s;
      }
      #processBtn {
        background-color: #4a90e2;
        color: white;
      }
      #processBtn:hover {
        background-color: #357abd;
      }
      #processBtn:disabled {
        background-color: #ccc;
        cursor: not-allowed;
      }
      .status {
        margin-top: 15px;
        text-align: center;
        font-size: 0.9rem;
        color: #0056b3;
        font-weight: 500;
        min-height: 20px;
      }
      canvas {
        margin-top: 20px;
        max-width: 100%;
        border-radius: 4px;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        display: none;
      }
      .section-title {
        font-weight: bold;
        margin-bottom: 5px;
        display: block;
        font-size: 0.95rem;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h2>Mã hóa/Giải mã Ảnh</h2>
      <p class="info">
        Tải lên một hình ảnh, thư mục hoặc file ZIP, nhập mật khẩu để biến đổi
        ảnh. Cùng một mật khẩu và phương thức sẽ giải mã ảnh trở lại.
      </p>

      <div class="form-group radio-group">
        <label
          ><input
            type="radio"
            name="inputType"
            id="inputTypeFile"
            value="file"
            checked
          />
          Hình ảnh / ZIP</label
        >
        <label
          ><input
            type="radio"
            name="inputType"
            id="inputTypeFolder"
            value="folder"
          />
          Thư mục</label
        >
      </div>

      <div class="form-group radio-group">
        <label
          ><input type="radio" name="actionType" value="encrypt" checked /> Mã
          hóa (Encrypt)</label
        >
        <label
          ><input type="radio" name="actionType" value="decrypt" /> Giải mã
          (Decrypt)</label
        >
      </div>

      <div class="form-group radio-group">
        <label
          ><input
            type="radio"
            name="encryptionMethod"
            value="scanline"
            checked
          />
          Quét dòng (Scanline - Mặc định)</label
        >
        <label
          ><input type="radio" name="encryptionMethod" value="noise" /> Nhiễu
          hạt (Noise)</label
        >
      </div>

      <div class="form-group">
        <label class="section-title"
          >Mức độ nén ZIP (Ảnh hưởng thời gian & dung lượng):</label
        >
        <select id="compressionLevel">
          <option value="0">
            Không nén (Lưu trữ - Nhanh nhất, tốn dung lượng)
          </option>
          <option value="4">Nén nhẹ (Tốc độ & Dung lượng cân bằng)</option>
          <option value="6" selected>Nén vừa (Mặc định)</option>
          <option value="9">
            Nén tối đa (Chậm nhất, tiết kiệm dung lượng)
          </option>
        </select>
      </div>

      <div class="form-group">
        <input
          type="file"
          id="fileInput"
          accept="image/png, image/jpeg, image/webp, application/zip"
        />
      </div>

      <div class="form-group">
        <input
          type="password"
          id="password"
          placeholder="Nhập mật khẩu (Secret Key)"
        />
      </div>

      <div class="checkbox-group">
        <input type="checkbox" id="genPwdFile" checked />
        <label for="genPwdFile"
          >Tạo file mật khẩu trong thư mục/ZIP (Mặc định: Bật)</label
        >
      </div>

      <div class="checkbox-group">
        <input type="checkbox" id="useWorker" checked />
        <label for="useWorker"
          >Sử dụng Web Worker (Tối ưu CPU, không làm đơ trang)</label
        >
      </div>

      <button id="processBtn">Bắt đầu Xử lý</button>

      <div class="status" id="statusText"></div>

      <canvas id="canvas"></canvas>
    </div>

    <!-- Đoạn mã xử lý Web Worker (nội tuyến) -->
    <script id="workerCode" type="javascript/worker">
      function mulberry32(a) {
        return function () {
          var t = (a += 0x6d2b79f5);
          t = Math.imul(t ^ (t >>> 15), t | 1);
          t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
          return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
        };
      }

      function cyrb128(str) {
        let h1 = 1779033703, h2 = 3144134277, h3 = 1013904242, h4 = 2773480762;
        for (let i = 0, k; i < str.length; i++) {
          k = str.charCodeAt(i);
          h1 = h2 ^ Math.imul(h1 ^ k, 597399067);
          h2 = h3 ^ Math.imul(h2 ^ k, 2869860233);
          h3 = h4 ^ Math.imul(h3 ^ k, 951274213);
          h4 = h1 ^ Math.imul(h4 ^ k, 2716044179);
        }
        h1 = Math.imul(h3 ^ (h1 >>> 18), 597399067);
        h2 = Math.imul(h4 ^ (h2 >>> 22), 2869860233);
        h3 = Math.imul(h1 ^ (h3 >>> 17), 951274213);
        h4 = Math.imul(h2 ^ (h4 >>> 19), 2716044179);
        return (h1 ^ h2 ^ h3 ^ h4) >>> 0;
      }

      self.onmessage = function (e) {
        const { buffer, width, height, password, method, action } = e.data;
        const data = new Uint8ClampedArray(buffer);

        if (method === 'noise') {
          const seed = cyrb128(password);
          const rand = mulberry32(seed);
          for (let i = 0; i < data.length; i += 4) {
            data[i] ^= Math.floor(rand() * 256);
            data[i + 1] ^= Math.floor(rand() * 256);
            data[i + 2] ^= Math.floor(rand() * 256);
          }
        } else if (method === 'scanline') {
          const channels = 4;
          const rowByteLength = width * channels;
          const output = new Uint8ClampedArray(data.length);
          const rand = mulberry32(
            cyrb128(`${password}:${width}x${height}:${channels}:scanline`)
          );

          for (let row = 0; row < height; row += 1) {
            const offset = width === 0 ? 0 : Math.floor(rand() * width);
            const reverse = rand() >= 0.5;

            for (let destinationColumn = 0; destinationColumn < width; destinationColumn += 1) {
              const transformedColumn =
                action === 'encrypt'
                  ? destinationColumn
                  : reverse
                    ? width - 1 - destinationColumn
                    : destinationColumn;
              const rolledColumn =
                action === 'encrypt'
                  ? (destinationColumn - offset + width) % width
                  : (transformedColumn + offset) % width;
              const sourceColumn =
                action === 'encrypt' && reverse
                  ? width - 1 - rolledColumn
                  : rolledColumn;

              const srcStart = row * rowByteLength + sourceColumn * channels;
              const destStart = row * rowByteLength + destinationColumn * channels;

              output[destStart] = data[srcStart];
              output[destStart + 1] = data[srcStart + 1];
              output[destStart + 2] = data[srcStart + 2];
              output[destStart + 3] = data[srcStart + 3];
            }
          }
          data.set(output);
        }

        self.postMessage({ buffer: data.buffer }, [data.buffer]);
      };
    </script>

    <script>
      const inputTypeFile = document.getElementById('inputTypeFile');
      const inputTypeFolder = document.getElementById('inputTypeFolder');
      const fileInput = document.getElementById('fileInput');
      const passwordInput = document.getElementById('password');
      const processBtn = document.getElementById('processBtn');
      const statusText = document.getElementById('statusText');
      const genPwdFile = document.getElementById('genPwdFile');
      const useWorkerCheckbox = document.getElementById('useWorker');
      const compressionLevelSelect =
        document.getElementById('compressionLevel');
      const canvas = document.getElementById('canvas');
      const ctx = canvas.getContext('2d');

      // Khởi tạo Web Worker
      const workerBlob = new Blob(
        [document.getElementById('workerCode').textContent],
        { type: 'text/javascript' },
      );
      const workerUrl = URL.createObjectURL(workerBlob);
      let worker = new Worker(workerUrl);

      inputTypeFile.onchange = () => {
        fileInput.removeAttribute('webkitdirectory');
        fileInput.removeAttribute('multiple');
        fileInput.accept = 'image/png, image/jpeg, image/webp, application/zip';
        fileInput.value = '';
        canvas.style.display = 'none';
      };

      inputTypeFolder.onchange = () => {
        fileInput.setAttribute('webkitdirectory', '');
        fileInput.setAttribute('multiple', '');
        fileInput.removeAttribute('accept');
        fileInput.value = '';
        canvas.style.display = 'none';
      };

      fileInput.onchange = function (e) {
        canvas.style.display = 'none';
        const files = e.target.files;
        if (inputTypeFile.checked && files.length === 1) {
          const file = files[0];
          const ext = file.name.split('.').pop().toLowerCase();
          if (['png', 'jpg', 'jpeg', 'webp'].includes(ext)) {
            const reader = new FileReader();
            reader.onload = function (event) {
              const img = new Image();
              img.onload = function () {
                canvas.width = img.width;
                canvas.height = img.height;
                ctx.drawImage(img, 0, 0);
                canvas.style.display = 'block';
              };
              img.src = event.target.result;
            };
            reader.readAsDataURL(file);
          }
        }
      };

      // Các hàm fallback khi không dùng Web Worker
      function mulberry32(a) {
        return function () {
          var t = (a += 0x6d2b79f5);
          t = Math.imul(t ^ (t >>> 15), t | 1);
          t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
          return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
        };
      }

      function cyrb128(str) {
        let h1 = 1779033703,
          h2 = 3144134277,
          h3 = 1013904242,
          h4 = 2773480762;
        for (let i = 0, k; i < str.length; i++) {
          k = str.charCodeAt(i);
          h1 = h2 ^ Math.imul(h1 ^ k, 597399067);
          h2 = h3 ^ Math.imul(h2 ^ k, 2869860233);
          h3 = h4 ^ Math.imul(h3 ^ k, 951274213);
          h4 = h1 ^ Math.imul(h4 ^ k, 2716044179);
        }
        h1 = Math.imul(h3 ^ (h1 >>> 18), 597399067);
        h2 = Math.imul(h4 ^ (h2 >>> 22), 2869860233);
        h3 = Math.imul(h1 ^ (h3 >>> 17), 951274213);
        h4 = Math.imul(h2 ^ (h4 >>> 19), 2716044179);
        return (h1 ^ h2 ^ h3 ^ h4) >>> 0;
      }

      function transformImageDataSync(imageData, password, method, action) {
        const data = imageData.data;
        const width = imageData.width;
        const height = imageData.height;

        if (method === 'noise') {
          const seed = cyrb128(password);
          const rand = mulberry32(seed);
          for (let i = 0; i < data.length; i += 4) {
            data[i] ^= Math.floor(rand() * 256);
            data[i + 1] ^= Math.floor(rand() * 256);
            data[i + 2] ^= Math.floor(rand() * 256);
          }
        } else if (method === 'scanline') {
          const channels = 4;
          const rowByteLength = width * channels;
          const output = new Uint8ClampedArray(data.length);
          const rand = mulberry32(
            cyrb128(`${password}:${width}x${height}:${channels}:scanline`),
          );

          for (let row = 0; row < height; row += 1) {
            const offset = width === 0 ? 0 : Math.floor(rand() * width);
            const reverse = rand() >= 0.5;

            for (
              let destinationColumn = 0;
              destinationColumn < width;
              destinationColumn += 1
            ) {
              const transformedColumn =
                action === 'encrypt'
                  ? destinationColumn
                  : reverse
                    ? width - 1 - destinationColumn
                    : destinationColumn;
              const rolledColumn =
                action === 'encrypt'
                  ? (destinationColumn - offset + width) % width
                  : (transformedColumn + offset) % width;
              const sourceColumn =
                action === 'encrypt' && reverse
                  ? width - 1 - rolledColumn
                  : rolledColumn;

              const srcStart = row * rowByteLength + sourceColumn * channels;
              const destStart =
                row * rowByteLength + destinationColumn * channels;

              output[destStart] = data[srcStart];
              output[destStart + 1] = data[srcStart + 1];
              output[destStart + 2] = data[srcStart + 2];
              output[destStart + 3] = data[srcStart + 3];
            }
          }
          data.set(output);
        }
      }

      function transformImageBlob(blob, password, method, action, useWorker) {
        return new Promise((resolve, reject) => {
          const img = new Image();
          const url = URL.createObjectURL(blob);
          img.onload = () => {
            URL.revokeObjectURL(url);
            const tempCanvas = document.createElement('canvas');
            tempCanvas.width = img.width;
            tempCanvas.height = img.height;
            const tempCtx = tempCanvas.getContext('2d');
            tempCtx.drawImage(img, 0, 0);

            const imageData = tempCtx.getImageData(
              0,
              0,
              tempCanvas.width,
              tempCanvas.height,
            );

            if (useWorker) {
              const msgHandler = function (e) {
                worker.removeEventListener('message', msgHandler);
                worker.removeEventListener('error', errHandler);

                const outData = new Uint8ClampedArray(e.data.buffer);
                const newImageData = tempCtx.createImageData(
                  tempCanvas.width,
                  tempCanvas.height,
                );
                newImageData.data.set(outData);
                tempCtx.putImageData(newImageData, 0, 0);
                tempCanvas.toBlob((outBlob) => resolve(outBlob), 'image/png');
              };

              const errHandler = function (err) {
                worker.removeEventListener('message', msgHandler);
                worker.removeEventListener('error', errHandler);
                reject(err);
              };

              worker.addEventListener('message', msgHandler);
              worker.addEventListener('error', errHandler);

              worker.postMessage(
                {
                  buffer: imageData.data.buffer,
                  width: tempCanvas.width,
                  height: tempCanvas.height,
                  password,
                  method,
                  action,
                },
                [imageData.data.buffer],
              );
            } else {
              transformImageDataSync(imageData, password, method, action);
              tempCtx.putImageData(imageData, 0, 0);
              tempCanvas.toBlob((outBlob) => resolve(outBlob), 'image/png');
            }
          };
          img.onerror = () => {
            URL.revokeObjectURL(url);
            reject(new Error('Lỗi khi đọc ảnh.'));
          };
          img.src = url;
        });
      }

      function downloadBlob(blob, filename) {
        const link = document.createElement('a');
        link.download = filename;
        link.href = URL.createObjectURL(blob);
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        setTimeout(() => URL.revokeObjectURL(link.href), 5000);
      }

      processBtn.onclick = async function () {
        const files = fileInput.files;
        const password = passwordInput.value;
        const method = document.querySelector(
          'input[name="encryptionMethod"]:checked',
        ).value;
        const action = document.querySelector(
          'input[name="actionType"]:checked',
        ).value;
        const useWorker = useWorkerCheckbox.checked;
        const compressionLevel = parseInt(compressionLevelSelect.value, 10);

        if (files.length === 0 || !password) {
          alert('Vui lòng chọn file/thư mục và nhập mật khẩu.');
          return;
        }

        processBtn.disabled = true;
        statusText.style.color = '#0056b3';

        try {
          const isFolder = inputTypeFolder.checked;
          const firstFileName = files[0].name.toLowerCase();
          const isZip = !isFolder && firstFileName.endsWith('.zip');

          if (isFolder || isZip) {
            statusText.textContent = 'Đang đọc danh sách file...';
            const zip = new JSZip();
            let inputFiles = [];

            if (isFolder) {
              inputFiles = Array.from(files);
            } else {
              const zipContent = await JSZip.loadAsync(files[0]);
              for (const [path, zipEntry] of Object.entries(zipContent.files)) {
                if (!zipEntry.dir) {
                  const blob = await zipEntry.async('blob');
                  blob.name = path;
                  blob.webkitRelativePath = path;
                  inputFiles.push(blob);
                }
              }
            }

            let processedCount = 0;
            for (const file of inputFiles) {
              let filePath = file.webkitRelativePath || file.name;

              if (
                filePath.includes('__MACOSX') ||
                filePath.includes('.DS_Store')
              ) {
                continue;
              }

              const ext = filePath.split('.').pop().toLowerCase();
              if (['png', 'jpg', 'jpeg', 'webp'].includes(ext)) {
                statusText.textContent = `Đang xử lý ảnh: ${filePath}...`;
                try {
                  const outBlob = await transformImageBlob(
                    file,
                    password,
                    method,
                    action,
                    useWorker,
                  );
                  filePath =
                    filePath.substring(0, filePath.lastIndexOf('.')) + '.png';
                  zip.file(filePath, outBlob);
                } catch (e) {
                  console.warn(`Không thể xử lý ảnh ${filePath}`, e);
                  zip.file(filePath, file);
                }
              } else {
                zip.file(filePath, file);
              }
              processedCount++;
            }

            if (genPwdFile.checked && action === 'encrypt') {
              zip.file(`.password.${password}.${method}.truyendrive`, '');
            }

            statusText.textContent = 'Đang đóng gói ZIP...';

            const zipOptions = { type: 'blob' };
            if (compressionLevel === 0) {
              zipOptions.compression = 'STORE';
            } else {
              zipOptions.compression = 'DEFLATE';
              zipOptions.compressionOptions = { level: compressionLevel };
            }

            const outZipBlob = await zip.generateAsync(zipOptions);

            const suffix = action === 'encrypt' ? 'encrypted' : 'decrypted';
            const outName = isFolder
              ? `folder_${suffix}.zip`
              : files[0].name.replace('.zip', '') + `_${suffix}.zip`;
            downloadBlob(outZipBlob, outName);

            statusText.textContent = `Đã hoàn tất! Xử lý ${processedCount} file.`;
            statusText.style.color = '#28a745';
          } else {
            const file = files[0];
            const ext = firstFileName.split('.').pop().toLowerCase();
            if (!['png', 'jpg', 'jpeg', 'webp'].includes(ext)) {
              alert('Vui lòng chọn ảnh định dạng PNG/JPG/WEBP hoặc file ZIP.');
              processBtn.disabled = false;
              statusText.textContent = '';
              return;
            }

            statusText.textContent = 'Đang xử lý ảnh...';
            const outBlob = await transformImageBlob(
              file,
              password,
              method,
              action,
              useWorker,
            );

            const suffix = action === 'encrypt' ? 'encrypted' : 'decrypted';
            const outName =
              file.name.substring(0, file.name.lastIndexOf('.')) +
              `_${suffix}.png`;
            downloadBlob(outBlob, outName);

            const url = URL.createObjectURL(outBlob);
            const img = new Image();
            img.onload = () => {
              ctx.clearRect(0, 0, canvas.width, canvas.height);
              ctx.drawImage(img, 0, 0);
              URL.revokeObjectURL(url);
            };
            img.src = url;

            statusText.textContent = 'Đã hoàn tất!';
            statusText.style.color = '#28a745';
          }
        } catch (err) {
          console.error(err);
          statusText.textContent = 'Có lỗi xảy ra: ' + err.message;
          statusText.style.color = '#dc3545';
        } finally {
          processBtn.disabled = false;
        }
      };
    </script>
  </body>
</html>
